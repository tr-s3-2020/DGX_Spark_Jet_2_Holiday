[tool.setuptools.package-data]
"implicit_health_triage.task2" = ["safety/rails/*.yml", "safety/rails/*.co"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "implicit-health-triage"
version = "0.1.0"
description = "Implicit health signal extraction and medication safety skill for elderly companion."
requires-python = ">=3.10,<3.14"

dependencies = [
    "nemoguardrails==0.24.1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "orjson>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Must match `requires-python` above. Linting for 3.11 while claiming 3.10
# support makes ruff flag the StrEnum backport as dead code — it is not dead,
# it is what keeps the package importable on 3.10.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
