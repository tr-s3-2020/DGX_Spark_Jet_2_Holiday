[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "life-memoir-retriever"
version = "0.1.0"
description = "Source-backed elder conversation memory and personal chronicles"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7", "build>=1,<2"]

[project.scripts]
memory-skill = "life_memoir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
